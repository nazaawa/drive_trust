<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A74DA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#054b8c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00000044"/>
    </filter>
  </defs>
  
  <!-- Main Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#blueGradient)" stroke="#F5A623" stroke-width="8" filter="url(#shadow)" />
  
  <!-- Stylized Car -->
  <path d="M50 120 L150 120 L165 85 L140 65 L60 65 L35 85 Z" fill="#FFFFFF" stroke="#333333" stroke-width="3" />
  <path d="M60 65 L70 45 L130 45 L140 65" fill="none" stroke="#333333" stroke-width="3" />
  
  <!-- Windows -->
  <path d="M70 65 L80 50 L120 50 L130 65" fill="#D6EAF8" stroke="#333333" stroke-width="2" />
  
  <!-- Wheels with Details -->
  <circle cx="60" cy="130" r="12" fill="#333333" />
  <circle cx="60" cy="130" r="5" fill="#777777" />
  <circle cx="140" cy="130" r="12" fill="#333333" />
  <circle cx="140" cy="130" r="5" fill="#777777" />
  
  <!-- Financial Symbol -->
  <text x="100" y="100" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#F5A623" text-anchor="middle" filter="url(#shadow)">€</text>
</svg>
